syntax = "proto3";
package emg;

option java_multiple_files = true;
option java_package = "dev.yourcompany.emg";
option java_outer_classname = "EmgProto";

// Optionaler Subscribe-Parameter (z.B. Drosselung)
message SubscribeRequest {
  uint32 max_rate_hz = 1; // 0 = keine Drosselung
}

// EMG-Sample
message EmgSample {
  uint32 value = 1;   // 0..1000 (clamped)
  uint64 ts_ms = 2;   // epoch ms
  uint32 battery = 3; // 0..100; 255 = unbekannt
}

service Emg {
  rpc StreamEmg(SubscribeRequest) returns (stream EmgSample);
}
