syntax = "proto3";
package emg;

option java_multiple_files = true;
option java_package = "dev.cortec-neuro.emg";
option java_outer_classname = "EmgProto";

// ===== EMG =====
message SubscribeRequest {
  uint32 max_rate_hz = 1;
}

message EmgSample {
  uint32 value = 1;   // 0..1000 (clamped)
  uint64 ts_ms = 2;   // epoch ms
  uint32 battery = 3; // 0..100; 255 = unbekannt
}

message EmgSamplePacket {
  repeated EmgSample samples = 1;
}

service Emg {
  // BLE:
  //   Service UUID:  f8c94a20-9f1f-4f5a-8ad1-3d1b7c0a1000
  //   Param UUID:    f8c94a20-9f1f-4f5a-8ad1-3d1b7c0a1001
  //   Return UUID:   f8c94a20-9f1f-4f5a-8ad1-3d1b7c0a1002
  rpc StreamEmg(SubscribeRequest) returns (stream EmgSample);

  rpc StreamEmgPackets(SubscribeRequest) returns (stream EmgSamplePacket);
}


// ===== ACCEL =====
message AccelSubscribeRequest {
  uint32 max_rate_hz = 1;
  uint32 axis = 2;
}

message AccelSample {
  double ax = 1;   // g
  double ay = 2;   // g
  double az = 3;   // g
  double mag = 4;  // g
  uint64 ts_ms = 5;
}

service Accel {
  // BLE:
  //   Service UUID:  f8c94a20-9f1f-4f5a-8ad1-3d1b7c0a2000
  //   Param UUID:    f8c94a20-9f1f-4f5a-8ad1-3d1b7c0a2001
  //   Return UUID:   f8c94a20-9f1f-4f5a-8ad1-3d1b7c0a2002
  rpc StreamAccel(AccelSubscribeRequest) returns (stream AccelSample);

  rpc StreamAccelPackets(AccelSubscribeRequest) returns (stream AccelSamplePacket);
}
