syntax = "proto3";
package emg;

option java_multiple_files = true;
option java_package = "dev.cortec-neuro.emg";
option java_outer_classname = "FusionProto";

// ===== FUSION (EMG + ACCEL) =====

message FusionSubscribeRequest {
  uint32 max_rate_hz = 1;
}

message FusedSample {
  uint64 ts_ms     = 1;
  uint32 seq       = 2;

  float  emg_level = 3;
  bool   emg_valid = 4;
  uint32 emg_count = 5;

  float  move_level = 6;
  float  move_var   = 7;
  bool   acc_valid  = 8;
  uint32 acc_count  = 9;
}

// Paket mit mehreren FusedSample
message FusedSamplePacket {
  repeated FusedSample samples = 1;
}

// gRPC service for fusion
service Fusion {
  rpc StreamFusion(FusionSubscribeRequest) returns (stream FusedSample);
}
